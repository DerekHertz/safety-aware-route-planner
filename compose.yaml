services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      # recorded (default): fixtures only, no OSRM or Overpass needed.
      # live: GAPCROSS_SOURCES=live docker compose --profile live up (needs the OSRM graph)
      GAPCROSS_SOURCES: ${GAPCROSS_SOURCES:-recorded}
      GAPCROSS_OSRM_URL: http://osrm:5000
  # Berkeley-only OSRM (MLD, car). Build the data first: server/osrm/prepare.sh
  osrm:
    profiles: ["live"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/berkeley.osrm
    volumes:
      - ./server/osrm/data:/data:ro
    ports:
      - "5000:5000"
