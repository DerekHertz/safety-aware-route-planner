[project]
name = "gapcross"
version = "0.1.0"
description = "Gap-crossing route comparison service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.32",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gapcross"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not live\""
markers = ["live: touches the network or a local OSRM; run with -m live"]
