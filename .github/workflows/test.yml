name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12 is the project floor. It is not a preference: numpy >= 2.5 and
          # scipy >= 1.18 both declare requires-python >= 3.12, so the pinned
          # runtime cannot install below it. (The first CI run caught exactly
          # this — the README claimed 3.11+ and pip disagreed.)
          - { os: ubuntu-latest, python: "3.12" }
          # Forward-compat canary. Nothing ships on 3.13 yet; this is here to
          # find out about breakage on our schedule rather than someone else's.
          - { os: ubuntu-latest, python: "3.13" }
          # Windows is NOT optional. core/setup.py selects MSVC-specific flags
          # (/fp:precise, deliberately not /fp:fast) that its own comment calls
          # "required for bitwise parity with pyref", and that configuration has
          # only ever been exercised on the maintainer's machine. Linux builds
          # with -O2 -ffp-contract=off. If the two ever disagree, the fix is the
          # compiler flags — never SR_PARITY_LOOSE, which would defeat the point.
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Builds the sr_core extension. A wheel rather than an editable install,
      # so a compile failure is a hard error here instead of a silent fallback
      # to the ~20x slower pure-Python engine at import time.
      - name: Build the C++ core
        run: pip install ./core

      - name: Fetch graph packs
        uses: ./.github/actions/fetch-packs
        with:
          # Only berkeley_small is needed: it is what the real-pack parity test
          # loads. berkeley_oakland is 2.7 MB of download for no extra coverage.
          regions: berkeley_small
          # Required, not best-effort. Packs are published now, so a fetch
          # failure means CI would silently drop real-pack parity — exactly the
          # hole test_ci_preconditions.py exists to close.
          optional: "false"

      # SR_CI_STRICT turns tests/test_ci_preconditions.py from advisory into
      # enforcing: sr_core must import, the real pack must be present, and its
      # format_version must match the code. Without it a run can be green while
      # having skipped the entire parity suite.
      - name: Run tests
        env:
          SR_CI_STRICT: "1"
        run: pytest tests/ -q

  web-build:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `npm run build`, never `next build` directly — the prebuild hook is what
      # copies MapLibre's worker into public/. Skipping it produces a silently
      # blank map, which is what the assertion below exists to catch.
      - run: npm run build

      - name: Assert build assets
        run: node scripts/assert-build-assets.mjs

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Built and exercised on every PR, because the alternative is finding out
      # at deploy time. The image is loaded into the local daemon rather than
      # pushed — nothing is published from a PR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sr-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not the same as working. This boots the real image, which
      # downloads packs from object storage exactly as production does.
      - name: Boot the image and check it serves
        run: |
          set -euo pipefail
          docker run -d --name sr-ci -p 8080:8080 sr-api:ci

          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health >/dev/null; then break; fi
            sleep 2
          done

          health=$(curl -fsS http://localhost:8080/health)
          echo "$health"

          # The pure-Python fallback only warns, and in production reads as
          # nothing but latency. A shipped image must have a working sr_core.
          echo "$health" | grep -q '"engine":"cpp"' \
            || { docker logs sr-ci; echo "::error::image fell back to the pure-Python engine"; exit 1; }

          curl -fsS -X POST http://localhost:8080/route \
            -H 'Content-Type: application/json' \
            -d '{"origin":{"lat":37.8715,"lon":-122.2680},
                 "destination":{"lat":37.8044,"lon":-122.2712},
                 "safety_enabled":true}' \
            | grep -q '"routes"' \
            || { docker logs sr-ci; echo "::error::image did not serve a route"; exit 1; }

          echo "image size: $(docker image inspect sr-api:ci --format '{{.Size}}' | numfmt --to=iec)"
          docker rm -f sr-ci >/dev/null
