# Fly.io app for the route API (`api/`). Runbook: docs/deploy.md.
#
#   fly deploy --ha=false
#
# One always-on machine. That is a decision, not a default left alone:
#   - Without SR_REDIS_URL the Nominatim budget is an in-process token bucket
#     (api/ratelimit.py, ADR-0013), correct at exactly one replica. Hence no
#     Redis, and hence `--ha=false`: Fly otherwise starts TWO machines on a
#     first deploy, which would double the ~1 req/s Nominatim ceiling.
#   - Packs load eagerly at startup, so a scale-to-zero cold start would put
#     pack loading in front of a tester's first route.
app = "safety-route-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # Packs are baked into the image from the public bucket in packs.lock
  # (the Dockerfile's PACK_REGIONS default). No build secret, no runtime token.

[env]
  SR_REGIONS = "berkeley_oakland,san_francisco"
  # Fly's proxy ends X-Forwarded-For with two entries it writes itself: the
  # client address it accepted the connection from (also sent as
  # Fly-Client-IP), then the app's own Fly IP, which is the rightmost
  # (docs.fly.io/networking/request-headers). So the client is the second
  # entry from the right, `xff[-2]` in api/ratelimit.client_key. A value of 1
  # would key every caller on the app's IP: one shared bucket. Anything a
  # caller sent sits further left and is ignored.
  SR_TRUSTED_PROXIES = "2"
  # The Vercel production origin. Preview deployments are not allowed: an
  # anchored SR_CORS_ORIGIN_REGEX could add them later (see .env.example).
  SR_CORS_ORIGINS = "https://safety-route-flax.vercel.app"
  # SR_NOMINATIM_CONTACT is a Fly secret, so a personal contact never lands in
  # version control (docs/deploy.md).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  # /health answers 503 until both packs are loaded and reports
  # packs_loaded and engine, so it is readiness as well as liveness.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Measured 2026-10-27: 151 MiB resident with both packs loaded and a route
# served in each. 512 MB leaves 3x headroom for the response cache and
# request bursts.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
